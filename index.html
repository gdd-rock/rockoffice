<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Courier New',monospace}
#hud{position:fixed;top:10px;left:10px;z-index:10;color:#fff;font-size:20px;text-shadow:1px 1px 2px #000;pointer-events:none}
#hud .title{font-size:30px;color:#FFD700;font-weight:bold}
#info{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:10;background:rgba(0,0,0,0.85);border:3px solid #555;padding:15px 30px;color:#fff;font-size:18px;text-align:center;display:none;min-width:300px;pointer-events:none;max-width:500px}
#info .n{color:#FFD700;font-size:20px;font-weight:bold}
#info .h{color:#55FF55;font-size:18px}
#info .r{color:#aaa;margin-top:4px}
#info .s{color:#55FF55;margin-top:2px;font-size:16px}
#info .mood{margin-top:4px;font-size:18px}
#tip{position:fixed;bottom:5px;right:10px;z-index:10;color:#888;font-size:16px}
#buttons{position:fixed;top:10px;right:10px;z-index:10;display:flex;flex-direction:column;gap:5px}
#buttons button{background:rgba(0,0,0,0.7);border:2px solid #FFD700;color:#FFD700;padding:6px 12px;cursor:pointer;font-family:'Courier New';font-size:12px;text-align:left;transition:all .2s}

#event-log .praise{color:#FFD700}

#event-log .mood{color:#CC88FF}

<script>
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,500);
camera.position.set(55,38,55);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.target.set(24,0,20);
controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=10;controls.maxDistance=80;
controls.maxPolarAngle=Math.PI*0.45;
controls.update();

scene.background=new THREE.Color(0x88CCEE);
scene.fog=new THREE.Fog(0x88CCEE,60,120);

// Lights - bright and pleasant
scene.add(new THREE.AmbientLight(0xffffff,0.65));
const sun=new THREE.DirectionalLight(0xFFF5E0,0.6);
sun.position.set(30,40,20);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-40;sun.shadow.camera.right=40;
sun.shadow.camera.top=40;sun.shadow.camera.bottom=-40;
scene.add(sun);


const RW=48,RH=44;
const grid=[];for(let i=0;i<RW*RH;i++)grid[i]=0;
function sG(x,z,v){if(x>=0&&x<RW&&z>=0&&z<RH)grid[z*RW+x]=v;}
function gG(x,z){if(x<0||x>=RW||z<0||z>=RH)return 1;return grid[z*RW+x];}

/*  ╔══════════════════════════════════════════════════╗
    ║  FLOOR PLAN — 48×40 (top-down, Z=0 is top/north)║
    ║                                                  ║
    ║  Z 0-1   : Exterior wall                        ║
    ║  Z 1-9   : CEO Office(1-12) | Meeting(14-24)   ║
    ║            | Medical(26-35) | Reception(37-46)   ║
    ║  Z 9-10  : Corridor                             ║
    ║  Z 10-19 : Open-plan workspace (all 21 desks)   ║
    ║  Z 19-20 : Corridor                             ║
    ║  Z 20-27 : Gym(1-10) | Rest/Tea(12-22)         ║
    ║            | Entertainment(24-35) | Storage(37-46)║
    ║  Z 27-28 : South wall                           ║
    ║  Z 28+   : Outdoor (grass, farm, pond, assembly)║
    ╚══════════════════════════════════════════════════╝  */

// ===== EXTERIOR WALLS =====
for(let i=0;i<RW;i++){sG(i,0,1);sG(i,RH-1,1);}
for(let i=0;i<RH;i++){sG(0,i,1);sG(RW-1,i,1);}
// Main entrance (south wall, centered)
for(let x=20;x<=27;x++)sG(x,RH-1,0);
// Clear lobby area
for(let x=1;x<RW-1;x++)for(let z=33;z<RH-1;z++)sG(x,z,0);
// Emergency exit (north side)
sG(24,0,0);sG(25,0,0);

// ===== HORIZONTAL CORRIDORS =====
// North corridor z=9 (open, no wall - just mark floor different)
// South corridor z=19 (open)
// But we add partial walls to define rooms:

// ===== CEO OFFICE (x:1-11, z:1-8) =====
for(let z=1;z<=8;z++)sG(12,z,1); // East wall
sG(12,4,0);sG(12,5,0); // Door
for(let x=1;x<=11;x++)sG(x,9,1); // South wall (corridor boundary)
sG(5,9,0);sG(6,9,0); // Door to corridor

// ===== MEETING ROOM (x:14-23, z:1-8) =====
for(let z=1;z<=8;z++){sG(13,z,1);sG(24,z,1);} // Side walls
sG(13,4,0);sG(13,5,0); // Door from CEO
sG(24,4,0);sG(24,5,0); // Door east
for(let x=14;x<=23;x++)sG(x,9,1); // South wall
sG(18,9,0);sG(19,9,0); // Door to corridor

// ===== MEDICAL ROOM (x:26-35, z:1-8) =====
for(let z=1;z<=8;z++){sG(25,z,1);sG(36,z,1);}
sG(25,4,0);sG(25,5,0); // Door west
for(let x=26;x<=35;x++)sG(x,9,1);
sG(30,9,0);sG(31,9,0); // Door to corridor

// ===== SERVER ROOM 机房 (x:38-46, z:1-8) =====
for(let z=1;z<=8;z++)sG(37,z,1);
sG(37,4,0);sG(37,5,0); // Door
for(let x=38;x<=46;x++)sG(x,9,1);
sG(42,9,0);sG(43,9,0); // Door to corridor

// ===== OPEN WORKSPACE (x:1-46, z:10-18) — no internal walls, open plan =====
for(let x=1;x<RW-1;x++){sG(x,10,0);sG(x,18,0);} // Clear corridor lines
// South boundary of workspace
for(let x=1;x<RW-1;x++)sG(x,23,1);
// Gaps for doors
for(let dx=0;dx<6;dx++){sG(5+dx,23,0);sG(20+dx,23,0);sG(35+dx,23,0);}

// ===== GYM (x:1-10, z:20-27) =====
for(let z=24;z<=31;z++)sG(11,z,1);
sG(11,27,0);sG(11,28,0);
for(let x=1;x<=10;x++){sG(x,31,1);sG(x,24,0);}
sG(5,31,0);sG(6,31,0); // Gym south door

// ===== REST/TEA AREA (x:12-22, z:20-27) =====
for(let z=24;z<=31;z++){sG(23,z,1);}
sG(23,27,0);sG(23,28,0);
for(let x=12;x<=22;x++)sG(x,31,1);
sG(17,31,0);sG(18,31,0); // Rest south door

// ===== ENTERTAINMENT (x:24-35, z:20-27) =====
for(let z=24;z<=31;z++)sG(36,z,1);
sG(36,27,0);sG(36,28,0);
for(let x=24;x<=35;x++)sG(x,31,1);
sG(29,31,0);sG(30,31,0); // Entertainment south door

// ===== BATHROOM (x:38-46, z:20-27) =====
for(let z=24;z<=31;z++)sG(37,z,1);
sG(37,27,0);sG(37,28,0); // Door
for(let x=38;x<RW-1;x++)sG(x,31,1);
sG(42,31,0);sG(43,31,0); // Bathroom south door

// ===== SOUTH WALL removed — room walls at z=27 serve as boundary =====
// Only keep corner pillars
// no south pillar needed


const mc={};
function gM(c){const k=c.toString(16);if(!mc[k])mc[k]=new THREE.MeshLambertMaterial({color:c});return mc[k];}

// ===== RENDER FLOOR + WALLS =====
const fg=new THREE.BoxGeometry(1,0.15,1);
for(let x=0;x<RW;x++)for(let z=0;z<RH;z++){
  const v=gG(x,z);
  if(v===1){
    const isExt=x===0||x===RW-1||z===0||z===RH-1;
    const wc=isExt?0xE8DDD0:0xD8CCBB;
    const w=new THREE.Mesh(new THREE.BoxGeometry(1,3.5,1),gM(wc));
    w.position.set(x+.5,1.75,z+.5);w.castShadow=true;w.receiveShadow=true;scene.add(w);
    if(isExt&&(x+z)%4===0){
      const isX=x===0||x===RW-1;
      const g2=new THREE.Mesh(new THREE.BoxGeometry(isX?.12:.6,1.2,isX?.6:.12),
        new THREE.MeshLambertMaterial({color:0xAADDFF,transparent:true,opacity:0.4}));
      g2.position.set(x+.5,2.1,z+.5);scene.add(g2);
    }
  } else {
    let color;const ck=(x+z)%2===0;
    // CEO office
    if(x>=1&&x<=11&&z>=1&&z<=8) color=ck?0xD4B896:0xC8AA85;
    // Meeting room
    else if(x>=14&&x<=23&&z>=1&&z<=8) color=ck?0xBBC8D8:0xAABBCC;
    // Medical room
    else if(x>=26&&x<=35&&z>=1&&z<=8) color=ck?0xDDEEDD:0xCCDDCC;
    // Corridors (z=9 or z=19)
    else if(z===9||z===23) color=ck?0xCCCCCC:0xBBBBBB;
    // Open workspace
    else if(z>=10&&z<=22) color=ck?0xE5DDD5:0xDAD2CA;
    // Gym
    else if(x>=1&&x<=10&&z>=24&&z<=31) color=ck?0xC5D5C0:0xB8C8B3;
    // Rest area
    else if(x>=12&&x<=22&&z>=24&&z<=31) color=ck?0xE0D5CC:0xD5CABB;
    // Entertainment
    else if(x>=24&&x<=35&&z>=24&&z<=31) color=ck?0xD0C0D8:0xC5B5CC;
    // Server room
    else if(x>=38&&z>=1&&z<=8) color=ck?0xCCCCDD:0xBBBBCC;
    // Bathroom
    else if(x>=38&&z>=24&&z<=31) color=ck?0xCCDDDD:0xBBCCCC;
    else color=ck?0xDDCCBB:0xCCBBAA;
    const t=new THREE.Mesh(fg,gM(color));
    t.position.set(x+.5,-0.07,z+.5);t.receiveShadow=true;scene.add(t);
  }
}

// ===== OUTDOOR AREA =====
// Grass
const grs=new THREE.Mesh(new THREE.PlaneGeometry(120,60),gM(0x6B9E4A));
grs.rotation.x=-Math.PI/2;grs.position.set(24,-0.16,RH+25);grs.receiveShadow=true;scene.add(grs);
// Assembly area (paved)
for(let x=10;x<38;x++)for(let z=RH;z<RH+14;z++){
  const t=new THREE.Mesh(fg,gM((x+z)%2?0x999999:0xAAAAAA));
  t.position.set(x+.5,-0.07,z+.5);t.receiveShadow=true;scene.add(t);
}

// ===== LOBBY / RECEPTION (z:29-38, near main entrance) =====
// Lobby floor
for(let x=1;x<RW-1;x++)for(let z=33;z<RH-1;z++){
  if(gG(x,z)===0){
    const ck=(x+z)%2===0;
    const t=new THREE.Mesh(fg,gM(ck?0xE0D5CC:0xD5CABB));
    t.position.set(x+.5,-0.07,z+.5);t.receiveShadow=true;scene.add(t);
  }
}

// ===== AREA SIGNS =====
function mkSign(text,x,y,z,color,scale){
  const c=document.createElement('canvas');c.width=512;c.height=48;
  const ct=c.getContext('2d');
  ct.font='bold 26px sans-serif';const tw=ct.measureText(text).width;c.width=tw+30;ct.font='bold 26px sans-serif';
  ct.fillStyle='rgba(255,255,255,0.85)';ct.fillRect(0,0,c.width,48);ct.strokeStyle=color;ct.lineWidth=3;ct.strokeRect(1,1,c.width-2,46);
  ct.fillStyle=color;ct.textAlign='center';
  ct.fillText(text,c.width/2,34);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true}));
  s.scale.set(scale||4,.8,1);s.position.set(x,y,z);scene.add(s);return s;
}

mkSign('🚪 EXIT',24,3.2,RH-0.5,'#CC0000',3);

  运营中心:{x:2,z:13},资源管理:{x:6,z:13},邮件助手:{x:10,z:13},

  客服小助:{x:26,z:37},

function addDesk(x,z){
  const g=new THREE.Group();
  const top=new THREE.Mesh(new THREE.BoxGeometry(1.5,.08,.85),gM(0xB8956A));
  top.position.y=.72;top.castShadow=true;g.add(top);
  [[-.65,-.35],[.65,-.35],[-.65,.35],[.65,.35]].forEach(([a,b])=>{
    const l=new THREE.Mesh(new THREE.BoxGeometry(.06,.72,.06),gM(0x8B6240));
    l.position.set(a,.36,b);g.add(l);
  });
  const m=new THREE.Mesh(new THREE.BoxGeometry(.5,.38,.05),gM(0x222222));
  m.position.set(0,1.0,-.2);g.add(m);
  const s=new THREE.Mesh(new THREE.BoxGeometry(.44,.3,.02),new THREE.MeshBasicMaterial({color:0x224488}));
  s.position.set(0,1.0,-.17);g.add(s);
  g.position.set(x+.5,0,z+.5);scene.add(g);
  sG(x,z,2);
}
function addChair(x,z){
  const g=new THREE.Group();
  const seat=new THREE.Mesh(new THREE.BoxGeometry(.45,.06,.45),gM(0xCC3333));

  const back=new THREE.Mesh(new THREE.BoxGeometry(.45,.45,.06),gM(0xAA2222));
  back.position.set(0,.7,-.2);g.add(back);
  g.position.set(x+.5,0,z+1.2);scene.add(g);
}
Object.values(DP).forEach(d=>{addDesk(d.x,d.z);addChair(d.x,d.z);});

// ============ A* PATHFINDING ============
function findPath(sx,sz,ex,ez,ignoreWalls){
  sx=Math.round(sx);sz=Math.round(sz);ex=Math.round(ex);ez=Math.round(ez);
  sx=Math.max(0,Math.min(RW-1,sx));sz=Math.max(0,Math.min(RH-1,sz));
  ex=Math.max(0,Math.min(RW-1,ex));ez=Math.max(0,Math.min(RH+30,ez));
  const walkable=(x,z)=>{
    if(ignoreWalls&&(z>=RH))return true; // outdoor
    if(x<0||x>=RW)return false;
    if(z<0)return false;
    if(z>=28&&z<RH)return gG(x,z)===0||x>=1&&x<RW-1; // lobby + outdoor
    if(z>=RH)return x>=0&&x<RW; // outdoor area
    const v=gG(x,z);return v===0||v===2||v===3;
  };
  if(!walkable(ex,ez)){
    for(let r=1;r<5;r++)for(let dx=-r;dx<=r;dx++)for(let dz=-r;dz<=r;dz++){
      if(walkable(ex+dx,ez+dz)){ex+=dx;ez+=dz;r=99;break;}
    }
  }
  const key=(x,z)=>x+','+z;
  const open=[{x:sx,z:sz,g:0,f:0,p:null}];
  const closed=new Set();const gs={};gs[key(sx,sz)]=0;
  let it=0;
  while(open.length&&it<2000){
    it++;open.sort((a,b)=>a.f-b.f);
    const c=open.shift();
    if(c.x===ex&&c.z===ez){const p=[];let n=c;while(n){p.unshift({x:n.x,z:n.z});n=n.p;}return p;}
    closed.add(key(c.x,c.z));
    [[0,1],[0,-1],[1,0],[-1,0]].forEach(([dx,dz])=>{
      const nx=c.x+dx,nz=c.z+dz;
      if(closed.has(key(nx,nz))||!walkable(nx,nz))return;
      const ng=c.g+1,k=key(nx,nz);
      if(gs[k]!==undefined&&ng>=gs[k])return;
      gs[k]=ng;
      open.push({x:nx,z:nz,g:ng,f:ng+Math.abs(nx-ex)+Math.abs(nz-ez),p:c});
    });
  }
  return [{x:sx,z:sz}];
}

  s.scale.set(5,0.7,1);s.name='bubble';
  return s;
}

function showBubble(ch,text,color,dur){
  const old=ch.children.find(c=>c.name==='bubble');if(old)ch.remove(old);
  const b=mkBubble(text,color);b.position.y=5.0;ch.add(b);
  setTimeout(()=>{if(ch.children.includes(b))ch.remove(b);},dur||3000);
}

  d.innerHTML='<span class="t">'+new Date().toLocaleTimeString('zh-CN')+'</span> '+text;
  eventLog.prepend(d);
  if(eventLog.children.length>50)eventLog.lastChild.remove();
}
function toggleLog(){eventLog.style.display=eventLog.style.display==='none'?'block':'none';}

// ============ SOCIAL INTERACTIONS ============
const DESTS=[
  {n:'饮水机',x:13,z:25},{n:'休息区',x:17,z:26},{n:'健身房',x:5,z:23},
  {n:'会议室',x:18,z:4},{n:'娱乐区',x:30,z:23},{n:'卫生间',x:41,z:27},
];

function startInteraction(ch1,ch2,type){
  const u1=ch1.userData,u2=ch2.userData;
  u1.interactWith=ch2;u1.interactType=type;u1.interactTimer=120+Math.random()*80;
  u2.interactWith=ch1;u2.interactType=type;u2.interactTimer=u1.interactTimer;
  u1.state='interacting';u2.state='interacting';
  // Ensure minimum distance between interacting characters
  const dx=ch2.position.x-ch1.position.x,dz=ch2.position.z-ch1.position.z;
  const dist=Math.sqrt(dx*dx+dz*dz);
  if(dist<1.5){
    const nx=dx/(dist||1),nz=dz/(dist||1);
    ch1.position.x-=nx*(1.5-dist)/2;ch1.position.z-=nz*(1.5-dist)/2;
    ch2.position.x+=nx*(1.5-dist)/2;ch2.position.z+=nz*(1.5-dist)/2;
  }
  ch1.rotation.y=Math.atan2(dx,dz);
  ch2.rotation.y=Math.atan2(-dx,-dz);
}

function tickInteraction(ch){
  const ud=ch.userData;
  if(!ud.interactWith||ud.interactTimer<=0)return;
  ud.interactTimer--;
  const other=ud.interactWith.userData;
  const phase=ud.interactTimer;

  if(phase%30===0&&phase>0){
    const type=ud.interactType;
    if(type==='fight'){
      const lines=['你这代码能看吗！','你自己写的更烂！','冷静，讲道理','我要找领导评理！','哼，走着瞧','别推我！','你动手试试！','啊！打人了！'];
      showBubble(ch,lines[Math.floor(Math.random()*lines.length)],'#FF6666',2500);
      ud.mood='😤烦躁';
    }else if(type==='chat'){
      const lines=['最近项目怎么样？','还行，就是有点忙','一起吃午饭？','好主意！','听说要加新功能'];
      showBubble(ch,lines[Math.floor(Math.random()*lines.length)],null,2500);
    }else if(type==='play'){
      const lines=['来一局？','我肯定赢你！','再来一局！','你太厉害了','哈哈太好玩了'];
      showBubble(ch,lines[Math.floor(Math.random()*lines.length)],'#66FF66',2500);
      ud.mood='😊开心';
    }else if(type==='praise'){
      showBubble(ch,PRAISE_WORDS[Math.floor(Math.random()*PRAISE_WORDS.length)],'#FFD700',2500);
      other.mood='😊开心';other.thought='被表扬了，开心！';
    }else if(type==='criticize'){
      showBubble(ch,CRITICIZE_WORDS[Math.floor(Math.random()*CRITICIZE_WORDS.length)],'#FFAA44',2500);
      other.mood='😰焦虑';other.thought='被批评了，要改进...';
    }else if(type==='tattle'){
      const lines=['领导，他的代码有问题','那个方案不靠谱','他今天迟到了','我觉得应该换个方案'];
      showBubble(ch,lines[Math.floor(Math.random()*lines.length)],'#CC99FF',2500);
    }
  }

  if(ud.interactTimer<=0){
    // After fight - chance of injury
    if(ud.interactType==='fight'&&Math.random()<.35){
      ud.state='injured';ud.injuredTimer=120;
      ud.interactWith=null;ud.interactType=null;
      showBubble(ch,'啊...受伤了😵','#FF4444',3000);
      logEvent('💥 '+ud.bot.n+' 在争执中受伤倒地！','fight');
      return;
    }
    ud.state='working';ud.stateTimer=40+Math.random()*80;
    ud.interactWith=null;ud.interactType=null;
    const dx=Math.round(ud.deskX),dz=Math.round(ud.deskZ);
    ud.path=findPath(Math.round(ch.position.x),Math.round(ch.position.z),dx,dz);
    ud.pathIdx=0;ud.state='returning';ud.stateTimer=300;
  }
}

let frame=0;
function animate(){
  requestAnimationFrame(animate);frame++;controls.update();

  chars.forEach(ch=>{
    const ud=ch.userData;
    ud.stateTimer--;

    // Safety: reset if stuck too long
    if(ud.stateTimer<-500&&ud.state!=='healing'&&ud.state!=='gaming'&&ud.state!=='gym'&&ud.state!=='in_meeting'){
      ud.state='returning';
      ud.path=findPath(Math.round(ch.position.x),Math.round(ch.position.z),Math.round(ud.deskX),Math.round(ud.deskZ));
      ud.pathIdx=0;ud.stateTimer=300;
      ud.interactWith=null;ud.interactType=null;
      ch.rotation.x=0;ch.rotation.z=0;ch.rotation.y=0;ch.position.y=.2;
      ud.aL.rotation.x=0;ud.aR.rotation.x=0;ud.aL.rotation.z=0;ud.aR.rotation.z=0;
      ud.lL.rotation.x=0;ud.lR.rotation.x=0;
    }
    // Mood changes
    ud.moodTimer--;
    if(ud.moodTimer<=0){
      ud.mood=MOODS[Math.floor(Math.random()*MOODS.length)];
      ud.thought=THOUGHTS[Math.floor(Math.random()*THOUGHTS.length)];
      ud.moodTimer=80+Math.random()*100;
      if(Math.random()<.25)showBubble(ch,ud.mood.slice(0,2)+ud.thought.slice(0,12),null,4000);
    }

    // Interaction tick
    if(ud.state==='interacting'){tickInteraction(ch);if(ud.interactTimer<-60){ud.state='working';ud.interactWith=null;ud.interactType=null;ud.stateTimer=50;}return;}

    // Normal AI
    if(ud.state==='working'&&ud.stateTimer<=0&&globalMode==='normal'){
      // Limit concurrent wanderers
      const wanderers=chars.filter(c=>{const s=c.userData.state;return s==='walking'||s==='go_gaming'||s==='gaming'||s==='go_gym'||s==='gym'||s==='go_meeting';}).length;
      if(wanderers>=6){ud.stateTimer=100+Math.random()*150;}
      else{
      const r=Math.random();
      const avail=chars.filter(c=>c!==ch&&(c.userData.state==='working'||c.userData.state==='walking'));
      if(ud.bot.is张总&&r<.12&&avail.length){
        // ROCKER: praise or criticize - go to office
        const target=avail[Math.floor(Math.random()*avail.length)];
        const isPraise=Math.random()>.4;
        ud.state='summoning';ud.summonTarget=target;ud.summonType=isPraise?'praise':'criticize';
        // Both walk to 张总's office (8,20)
        ud.path=findPath(Math.round(ch.position.x),Math.round(ch.position.z),5,4);
        ud.pathIdx=0;ud.stateTimer=9999;
        target.userData.state='summoned';target.userData.summonBy=ch;
        target.userData.path=findPath(Math.round(target.position.x),Math.round(target.position.z),8,4);
        target.userData.pathIdx=0;target.userData.stateTimer=9999;
        showBubble(ch,target.userData.bot.n+'来我办公室','#FFD700',3000);
        showBubble(target,isPraise?'老板找我？':'完了...老板找我','#FFAA44',3000);
        logEvent('👑 洛克叫 '+target.userData.bot.n+' 去办公室'+(isPraise?'表扬':'批评'),'praise');
      }else if(r<.05){
        // Fight - can lead to injury
        const nearby=avail.filter(c=>Math.abs(c.position.x-ch.position.x)<8&&Math.abs(c.position.z-ch.position.z)<8);
        if(nearby.length){
          const target=nearby[Math.floor(Math.random()*nearby.length)];
          const reason=FIGHT_REASONS[Math.floor(Math.random()*FIGHT_REASONS.length)];
          logEvent(ud.bot.n+' 和 '+target.userData.bot.n+' 因为<b>'+reason+'</b>吵起来了！','fight');
          startInteraction(ch,target,'fight');return;
        }
      }else if(r<.15){
        // Chat
        if(avail.length){
          const target=avail[Math.floor(Math.random()*avail.length)];
          logEvent(ud.bot.n+' 找 '+target.userData.bot.n+' 聊天','chat');
          startInteraction(ch,target,'chat');return;
        }
      }else if(r<.18){
        // Tattle to 张总
        const boss=chars.find(c=>c.userData.bot.is张总);
        if(boss&&(boss.userData.state==='working'||boss.userData.state==='walking')&&!ud.bot.is张总){
          logEvent(ud.bot.n+' 去找领导告状了','mood');
          startInteraction(ch,boss,'tattle');return;
        }
      }else if(r<.28){
        // GO TO ENTERTAINMENT - gaming for ~15 seconds
        const gameSpot={x:26+Math.floor(Math.random()*4)*2,z:26+Math.random()*3};
        ud.path=findPath(Math.round(ch.position.x),Math.round(ch.position.z),Math.round(gameSpot.x),Math.round(gameSpot.z));
        ud.pathIdx=0;ud.state='go_gaming';ud.stateTimer=9999;
        showBubble(ch,'玩一会🎮','#66FF66',2000);
        logEvent(ud.bot.n+' 去娱乐室玩耍','play');
      }else if(r<.38){
        // GO TO GYM - workout for ~15 seconds
        const gymSpot={x:3+Math.floor(Math.random()*3)*2,z:26+Math.floor(Math.random()*2)*2};
        ud.path=findPath(Math.round(ch.position.x),Math.round(ch.position.z),Math.round(gymSpot.x),Math.round(gymSpot.z));
        ud.pathIdx=0;ud.state='go_gym';ud.stateTimer=9999;
        showBubble(ch,'去锻炼💪','#FFAA00',2000);
        logEvent(ud.bot.n+' 去健身房锻炼','chat');
      }else if(r<.44){
        // MEETING - grab 2-4 people, go to meeting room
        const meetPeople=avail.filter(c=>!c.userData.bot.is张总&&c.userData.state==='working').slice(0,Math.floor(Math.random()*2)+2);
        if(meetPeople.length>=2){
          ud.state='go_meeting';

          meetPeople.forEach((mp,i)=>{
            mp.userData.state='go_meeting';

            showBubble(mp,'好的，来了','#88CCFF',1500);

        logEvent(ud.bot.n+' 去'+dest.n,'chat');
      }else if(r<.62){
        // GO TO BATHROOM
        ud.path=findPath(Math.round(ch.position.x),Math.round(ch.position.z),41,27);
        ud.pathIdx=0;ud.state='walking';ud.stateTimer=200+Math.random()*100;

      }else if(r<.68){
        // GO TO REST AREA - drink water, chill
        const restSpots=[{x:15,z:26,t:'喝杯咖啡☕'},{x:19,z:26,t:'休息一会😌'},{x:13,z:25,t:'喝水💧'},{x:21,z:25,t:'买个饮料🥤'}];

        ud.path=findPath(Math.round(ch.position.x),Math.round(ch.position.z),spot.x,spot.z);
        ud.pathIdx=0;ud.state='walking';ud.stateTimer=200+Math.random()*150;
        showBubble(ch,spot.t,null,2000);
        logEvent(ud.bot.n+' 去休息区','chat');
      }else if(r<.72){
        // GO TO FISH POND - feed fish
        ud.path=findPath(Math.round(ch.position.x),Math.round(ch.position.z),24,RH+19);
        ud.pathIdx=0;ud.state='go_fishing';ud.stateTimer=9999;
        showBubble(ch,'去喂鱼🐟',null,2000);
        logEvent(ud.bot.n+' 去鱼塘喂鱼','play');
      }else if(r<.76){
        // GO TO FARM - tend animals
        const farmSide=Math.random()>.5;
        const fx=farmSide?40:5,fz=RH+6+Math.floor(Math.random()*5);
        ud.path=findPath(Math.round(ch.position.x),Math.round(ch.position.z),fx,fz);
        ud.pathIdx=0;ud.state='go_farm';ud.stateTimer=9999;
        showBubble(ch,farmSide?'去看牛羊🐑':'去喂小动物🐾',null,2000);
        logEvent(ud.bot.n+(farmSide?' 去牧场放牧':' 去喂小动物'),'play');
      }else if(r<.80){
        // GO TO SERVER ROOM (tech bots)
        ud.path=findPath(Math.round(ch.position.x),Math.round(ch.position.z),41,4);
        ud.pathIdx=0;ud.state='walking';ud.stateTimer=150+Math.random()*100;
        showBubble(ch,'检查服务器🖥️',null,2000);
        logEvent(ud.bot.n+' 去机房巡检','chat');
      }else if(r<.84){
        // Play with someone
        if(avail.length){
          const target=avail[Math.floor(Math.random()*avail.length)];
          logEvent(ud.bot.n+' 拉 '+target.userData.bot.n+' 去玩','play');
          startInteraction(ch,target,'play');return;
        }
      }else{
        ud.stateTimer=100+Math.random()*200;
        if(Math.random()<.4){ud.thought=THOUGHTS[Math.floor(Math.random()*THOUGHTS.length)];showBubble(ch,ud.mood.slice(0,2)+ud.thought.slice(0,12),null,3500);}
      }
      } // end wanderer limit
    }else if(ud.state==='walking'&&ud.stateTimer<=0){
      const dx=Math.round(ud.deskX),dz=Math.round(ud.deskZ);
      ud.path=findPath(Math.round(ch.position.x),Math.round(ch.position.z),dx,dz);
      ud.pathIdx=0;ud.state='returning';ud.stateTimer=400;
    }

    // Summoning - 张总 calls employee to office
    if(ud.state==='summoning'&&ud.pathIdx>=ud.path.length){
      const tgt=ud.summonTarget;
      if(tgt&&tgt.userData.pathIdx>=tgt.userData.path.length){
        // Both arrived at office - start extended interaction
        const type=ud.summonType;
        ud.state='office_meeting';tgt.userData.state='office_meeting';
        ud.interactWith=tgt;tgt.userData.interactWith=ch;
        ud.interactType=type;tgt.userData.interactType=type;
        ud.interactTimer=600;tgt.userData.interactTimer=600; // ~10 seconds at 60fps
        ud.officeMeetingPhase=0;tgt.userData.officeMeetingPhase=0;
        // Face each other
        ch.rotation.y=Math.PI;tgt.rotation.y=0;
      }
    }
    if(ud.state==='summoned'&&ud.pathIdx>=ud.path.length){
      // Wait for 张总
    }

    // Office meeting - extended praise/criticize with dialogue
    if(ud.state==='office_meeting'&&ud.bot.is张总){
      ud.interactTimer--;
      // Only in CEO office
      if(ch.position.x>12||ch.position.z>9){ud.interactTimer=0;}
      const tgt=ud.interactWith;
      const phase=Math.floor((600-ud.interactTimer)/60); // 0-9 phases
      const isPraise=ud.interactType==='praise';
      if(ud.interactTimer%60===30){
        // 张总 speaks
        const praiseLines=['最近工作表现很棒！','客户反馈非常好','这个项目做得不错','效率提升很明显','给你加鸡腿！','继续保持这个水准','我很欣赏你的态度','你是团队的骄傲','下个月考虑给你涨薪','优秀！非常优秀！'];
        const critLines=['这个月KPI没达标','代码质量需要提高','客户投诉增加了','你最近状态不好','必须改进！听到没','这种错误不能再犯','给我写检讨报告','扣你这个月奖金','三天内给我改好','再这样考虑换岗'];
        const lines=isPraise?praiseLines:critLines;
        showBubble(ch,lines[phase%lines.length],isPraise?'#FFD700':'#FF4444',2500);
      }
      if(ud.interactTimer%60===0&&tgt){
        // Employee responds
        const pResp=['谢谢老板！','我会继续努力的','太开心了！','不负期望！','谢谢认可🥹'];
        const cResp=['我会改的...','对不起老板','我马上整改','给我个机会','😰我知错了'];
        const resp=isPraise?pResp:cResp;
        showBubble(tgt,resp[phase%resp.length],isPraise?'#88FF88':'#FFAAAA',2500);
        tgt.userData.mood=isPraise?'😊开心':'😰焦虑';
        tgt.userData.thought=isPraise?'被老板表扬了，太开心了':'被老板批评了，心里不好受';
      }
      if(ud.interactTimer<=0){
        // End meeting
        ud.state='returning';tgt.userData.state='returning';
        ud.interactWith=null;tgt.userData.interactWith=null;
        ud.path=findPath(5,4,Math.round(ud.deskX),Math.round(ud.deskZ));ud.pathIdx=0;ud.stateTimer=300;
        tgt.userData.path=findPath(8,4,Math.round(tgt.userData.deskX),Math.round(tgt.userData.deskZ));
        tgt.userData.pathIdx=0;tgt.userData.stateTimer=300;
        logEvent('👑 办公室'+(isPraise?'表扬':'批评')+'结束，'+tgt.userData.bot.n+(isPraise?'心花怒放':'垂头丧气'),'praise');
      }
    }

    // Injured state - lying on ground at fight location
    if(ud.state==='injured'){
      ch.rotation.z=Math.PI/2;
      ch.position.y=.1;
      ud.injuredTimer--;
      if(ud.injuredTimer<=0){
        // Get up and walk to medical room
        ch.rotation.z=0;ch.position.y=.2;
        // Pick bed 1 (13.5,27) or bed 2 (13.5,29)
        const bedZ=(!window._bed1Taken)?3:6;
        if(bedZ===3)window._bed1Taken=ud.bot.id;else window._bed2Taken=ud.bot.id;
        ud.healBedZ=bedZ;
        ud.state='go_medical';
        ud.path=findPath(Math.round(ch.position.x),Math.round(ch.position.z),29,bedZ);
        ud.pathIdx=0;ud.stateTimer=9999;
        ud.mood='🤕受伤';ud.thought='好痛...要去医疗室';

        logEvent('🏥 '+ud.bot.n+' 被送往医疗室治疗','fight');

        const ob=v.mesh.children.find(c=>c.name==='bubble');if(ob)v.mesh.remove(ob);
        v.mesh.add(bs);
        setTimeout(()=>{const ob2=v.mesh.children.find(c=>c.name==='bubble');if(ob2)v.mesh.remove(ob2);},2500);
      }
      if(v.stateTimer<=0){
        // Leave
        v.state='leaving';
        v.path=findPath(Math.round(v.mesh.position.x),Math.round(v.mesh.position.z),24,RH-1);
        v.pathIdx=0;
        logEvent('🧑‍💼 '+v.name+(v.type==='interview'?' 面试结束，离开':' 培训结束，离开'),'chat');
      }
    }
    if(v.state==='leaving'){
      if(v.path.length>0&&v.pathIdx<v.path.length){
        const tg=v.path[v.pathIdx];
        const tx=tg.x+.5,tz=tg.z+.5;
        const dx3=tx-v.mesh.position.x,dz3=tz-v.mesh.position.z;
        const dist3=Math.sqrt(dx3*dx3+dz3*dz3);
        if(dist3<.2){v.pathIdx++;}
        else{
          v.mesh.position.x+=dx3/dist3*v.speed;
          v.mesh.position.z+=dz3/dist3*v.speed;
          v.mesh.rotation.y=Math.atan2(dx3,dz3);
          const sw3=Math.sin(frame*.2)*.5;
          v.vaL.rotation.x=sw3;v.vaR.rotation.x=-sw3;
        }
      }
      if(v.pathIdx>=v.path.length||v.timer>2000){
        scene.remove(v.mesh);visitors.splice(vi,1);
      }
    }
  }

  // Animate animals
  animals.forEach(a=>{
    const ud=a.userData;
    ud.timer++;
    if(ud.timer%120===0)ud.angle+=Math.random()*2-1;
    const nx=ud.baseX+Math.sin(ud.angle+ud.timer*.01)*ud.range;
    const nz=ud.baseZ+Math.cos(ud.angle+ud.timer*.013)*ud.range;
    a.position.x+=(nx-a.position.x)*.01;
    a.position.z+=(nz-a.position.z)*.01;
    a.rotation.y=Math.atan2(nx-a.position.x,nz-a.position.z);
    // Bobbing
    if(ud.type==='chicken'||ud.type==='duck')a.position.y=Math.abs(Math.sin(frame*.08+ud.angle))*.06;
  });
  // Animate fish
  fishes.forEach(f=>{
    f.phase+=f.speed;
    f.mesh.position.x=f.baseX+Math.sin(f.phase)*2.5;
    f.mesh.position.z=f.baseZ+Math.cos(f.phase*.7)*.8;
    f.mesh.rotation.y=Math.atan2(Math.cos(f.phase),Math.sin(f.phase*.7));
    f.mesh.position.y=.02+Math.sin(f.phase*3)*.03;
  });

  // Anti-overlap: gentle push only when characters overlap too much
  if(frame%3===0){
    for(let i=0;i<chars.length;i++){
      const a=chars[i];
      if(a.userData.state==='working'||a.userData.state==='injured'||a.userData.state==='healing'||a.userData.state==='gaming'||a.userData.state==='gym'||a.userData.state==='in_meeting')continue;
      for(let j=i+1;j<chars.length;j++){
        const b=chars[j];
        if(b.userData.state==='working'||b.userData.state==='injured'||b.userData.state==='healing'||b.userData.state==='gaming'||b.userData.state==='gym'||b.userData.state==='in_meeting')continue;
        const dx2=a.position.x-b.position.x,dz2=a.position.z-b.position.z;
        const d2=dx2*dx2+dz2*dz2;
        if(d2<0.7&&d2>0.001){
          const d=Math.sqrt(d2);
          const push=(0.8-d)*0.05;
          a.position.x+=dx2/d*push;a.position.z+=dz2/d*push;
          b.position.x-=dx2/d*push;b.position.z-=dz2/d*push;
        }
      }
    }
  }

  // Hover
  raycaster.setFromCamera(mouse,camera);
  const hits=raycaster.intersectObjects(chars,true);
  const info=document.getElementById('info');
  if(hits.length){
    let o=hits[0].object;while(o.parent&&!o.userData.bot)o=o.parent;
    if(o.userData.bot){
      const b=o.userData.bot,u=o.userData;
      const states={working:'💻工作中',walking:'🚶外出',returning:'🚶回岗',commanded:'📢执行命令',interacting:'💬互动中',summoning:'📢召见员工',summoned:'😰被叫去办公室',office_meeting:'🏢在总经理室',injured:'🤕受伤倒地',go_medical:'🚑送往医疗室',healing:'🛏️住院治疗中',visiting:'👑探望伤员',go_fishing:'🚶去鱼塘',fishing:'🐟喂鱼中',go_farm:'🚶去牧场',farming:'🐾喂动物中',go_gaming:'🚶去娱乐室',gaming:'🎮玩游戏中',go_gym:'🚶去健身房',gym:'🏋️锻炼中',go_meeting:'🚶去开会',in_meeting:'📋开会中'};
      let interactInfo='';
      if(u.interactWith){
        const types={fight:'⚔️争执',chat:'💬聊天',play:'🎮玩耍',praise:'⭐被表扬',criticize:'⚠️被批评',tattle:'🗣️告状'};
        interactInfo='<br>'+types[u.interactType]+' → '+u.interactWith.userData.bot.n;
      }
      info.style.display='block';
      info.innerHTML='<div class="n">'+(b.persona?'👤':'🤖')+' '+b.f+(b.isNew?' <span style="color:#55FF55">★NEW</span>':'')+(b.is张总?' 👑':'')+'</div><div class="h">'+b.h+' | '+b.title+'</div><div class="r">'+b.r+'</div><div class="s">'+(states[u.state]||'💻')+interactInfo+'</div><div class="mood">心情: '+u.mood+'<br>💭 '+u.thought+'</div>';
      renderer.domElement.style.cursor='pointer';
    }else{info.style.display='none';renderer.domElement.style.cursor='grab';}
  }else{info.style.display='none';renderer.domElement.style.cursor='grab';}

  document.getElementById('clock').textContent=new Date().toLocaleTimeString('zh-CN');
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
